<body class="immersive">

        <div class="sidebar">

            </div>

            
            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group"><label for="treatment">Light treatment</label><select id="treatment" onchange="updateTreatment(this.value)"><option value="optical">Optical pearl</option><option value="psychedelic">Psychedelic</option></select></div><div class="control-group"><label for="speed">Rhythm</label><div class="slider-container"><input type="range" id="speed" min="0.25" max="2" step="0.05" value="1" oninput="updateParam('speed',this.value)"><span class="value-display" id="speed-value">1</span></div></div><div class="control-group"><label for="spacing">Ring spacing</label><div class="slider-container"><input type="range" id="spacing" min="0.75" max="1.5" step="0.01" value="1" oninput="updateParam('spacing',this.value)"><span class="value-display" id="spacing-value">1</span></div></div><div class="control-group"><label for="wobble">Liquid contour</label><div class="slider-container"><input type="range" id="wobble" min="0" max="2" step="0.05" value="1" oninput="updateParam('wobble',this.value)"><span class="value-display" id="wobble-value">1</span></div></div><div class="control-group"><label for="iridescence">Iridescence</label><div class="slider-container"><input type="range" id="iridescence" min="0" max="1.5" step="0.05" value="1" oninput="updateParam('iridescence',this.value)"><span class="value-display" id="iridescence-value">1</span></div></div>
            </div>
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button><button class="button secondary" onclick="initializeSystem()">Regenerate</button>
                </div>
                <button class="button tertiary" style="margin-top:8px" onclick="downloadFrame()">Download PNG</button>
                <button class="button secondary" style="margin-top:8px" onclick="toggleControls()">Return to artwork</button>
                <p class="help">Space to pause · H for controls · F for fullscreen · R for a new seed</p>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <div class="art-caption" aria-hidden="true"><span class="eyebrow">A STUDY IN CONTINUOUS MOTION</span><span class="art-title">Opalia</span></div>
    <nav class="art-tools" aria-label="Artwork controls">

    <script>
const query = new URLSearchParams(location.search);
const defaultParams = Object.freeze({seed:12345,speed:1,spacing:1,wobble:1,iridescence:1,treatment:0});
let params = {...defaultParams};
if(query.get('look')==='psychedelic')params.treatment=1;
let visualParams = {...defaultParams};
let surface, renderer, simTime = Number(query.get('t') || 0), previousTick = 0;

const seedPhase = () => params.seed === 12345 ? 0 : ((params.seed * 0.61803398875) % 1) * Math.PI * 2;
const VERTEX = `

attribute vec3 aPosition;

const FRAGMENT = `
precision highp float;
varying vec2 uv;
uniform vec2 resolution;

uniform float lightTime;
uniform float spacing;

uniform float iridescence;

const float TAU=6.28318530718;
// A continuous radial coordinate and its spatial gradient. Each angular mode
// has its own retarded radial phase, so neighbouring folds never move in lockstep.
vec4 liquidCoordinate(vec2 p,float t){

  float travel=t-3.4*r;
  float a=atan(p.y,p.x)+0.88*travel;

  float a1=0.019*f1*sin(u1);
  float da1=0.019*(df1*sin(u1)-4.3*f1*cos(u1));
  float f2=r*exp(-r*5.5),df2=exp(-r*5.5)*(1.0-5.5*r);
  float u2=1.85*t-5.0*r+0.25+z;
  float f2b=r*exp(-r*0.7),df2b=exp(-r*0.7)*(1.0-0.7*r);

             +0.024*(df2b*sin(v2)-5.6*f2b*cos(v2));

  float ub=1.20*travel+0.6+z;

  float pa=a-0.32*travel-z;
  float gate=0.5+0.5*cos(pa),gate2=gate*gate,gate3=gate2*gate;

  float dae=dOuter*(0.020*sin(ue)+0.012*sin(ve))
            +outer*(-0.118*cos(ue)+0.108*cos(ve));

  // Two broad bulges sweep in different directions and collapse out of phase.
  // Their radial angle offsets put neighbouring rings' bulges on different sides.
  float uo=ub,vo=0.91*t+8.3*r+1.5;
  float ao=0.035*outer*sin(uo),dao=0.035*(dOuter*sin(uo)-4.08*outer*cos(uo));
  float bo=0.024*outer*sin(vo),dbo=0.024*(dOuter*sin(vo)+8.3*outer*cos(vo));

  float og=0.5+0.5*cos(po),og2=og*og,og3=og2*og;
  float ob=og2*og2,dob=-2.0*og3*sin(po);

  float qb=qg4*qg,dqb=-2.5*qg4*sin(qo);

  // Their envelope is zero throughout the centre's existing movement.
  float farX=clamp((r-0.50)/0.40,0.0,1.0);
  float far=farX*farX*(3.0-2.0*farX);

  float ug=ub;
  float cf=0.040*farR*sin(ug),dcf=0.040*(dFarR*sin(ug)-4.08*farR*cos(ug));
  float pg=pa;

              +ae*cos(pe)+ao*ob+bo*qb+af*cos(pf)+bf*cos(qf)+cf*fbump;
  float dr=1.0+wobble*(da1*cos(p1)+da2*cos(p2)+da3*cos(p3)+dab*bump+1.088*ab*dbump
              +dae*cos(pe)-1.7*ae*sin(pe)+dao*ob+1.088*ao*dob+dbo*qb-4.2*bo*dqb

              -2.0*ae*sin(pe)+ao*dob+bo*dqb-2.0*af*sin(pf)-3.0*bf*sin(qf)+cf*dfbump);

  // so the refracted light bends with the counterclockwise travelling swell.

}
float foldSlope(float w){
  // Derivative of a smooth logarithmic ripple: opposite faces meet in a soft crest.
  return 0.43*sin(w)/(0.032+1.0-cos(w));
}
float refractedLight(float w,float defocus){

  float focus=1.0+defocus;
  return 0.045*cos(w-0.55)+0.40/sqrt(focus)*exp(-29.0/focus*(1.0-cos(w)))
       -0.42*exp(-5.0/focus*(1.0-cos(w+0.42)));

void main(){
  vec2 p=(uv*2.0-1.0)*resolution/min(resolution.x,resolution.y);
  if(geometryPass>4.5) p*=1.35;
  else if(geometryPass>3.5) p*=2.65;
  else if(geometryPass>1.5 && geometryPass<2.5) p*=1.32;
  float t=time,lt=lightTime;
  p-=wobble*vec2(0.030*cos(t*0.81+0.65+variation),0.034*sin(t*0.73+1.2+variation));
  vec4 field=liquidCoordinate(p,t);

function stageSize(){
  const el=document.getElementById('canvas-container');
  return [Math.max(1,Math.round(el.clientWidth)),Math.max(1,Math.round(el.clientHeight))];
}
function setup(){
  document.querySelector('.loading').remove();
  const [w,h]=stageSize();
  pixelDensity(1);
  frameRate(120);
  setAttributes({alpha:false,antialias:false,preserveDrawingBuffer:true});
  renderer=createCanvas(w,h,WEBGL);
  renderer.parent('canvas-container');
  renderer.elt.setAttribute('aria-label','Animated pearlescent concentric ripples');
  renderer.elt.setAttribute('role','img');
  surface=createShader(VERTEX,FRAGMENT);
  noStroke();
  initializeSystem();
  previousTick=performance.now();
  document.getElementById('pause-button').textContent=running?'Pause':'Play';
  document.getElementById('pause-button').setAttribute('aria-label',running?'Pause animation':'Play animation');
  renderer.elt.addEventListener('webglcontextlost',event=>{
    event.preventDefault();contextLost=true;running=false;
    document.getElementById('motion-status').textContent='Graphics paused. Reload to restore.';
  });
  new ResizeObserver(()=>resizeStage()).observe(document.getElementById('canvas-container'));
  if(qaActive) runVisualChecks();
  if(query.has('capture')) requestAnimationFrame(recordMotionPreview);
}
function initializeSystem(){
  randomSeed(params.seed);noiseSeed(params.seed);
  visualParams={...params};
  simTime=Number(query.get('t') || 0);
  previousTick=performance.now();
  updateSeedDisplay();
  document.getElementById('treatment').value=params.treatment?'psychedelic':'optical';
}
function paintAt(t,settings=params,illuminationTime=t,geometryOnly=false){
  shader(surface);
  surface.setUniform('resolution',[width,height]);
  surface.setUniform('time',t);
  surface.setUniform('lightTime',illuminationTime);
  surface.setUniform('spacing',settings.spacing);
  surface.setUniform('wobble',settings.wobble);
  surface.setUniform('iridescence',settings.iridescence);
  surface.setUniform('variation',seedPhase());
  surface.setUniform('geometryPass',Number(geometryOnly));
  surface.setUniform('treatment',settings.treatment);
  rect(-width/2,-height/2,width,height);
}
function draw(){
  if(contextLost || qaActive) return;
  const now=performance.now(),dt=(now-previousTick)/1000;
  previousTick=now;
  const step=Math.min(dt,0.1),ease=1-Math.exp(-step*7.0);
  for(const key of ['speed','spacing','wobble','iridescence']){
    visualParams[key]+=(params[key]-visualParams[key])*ease;
  }
  visualParams.treatment=params.treatment;
  if(running){simTime+=step*visualParams.speed;frameSamples.push(dt);}
  paintAt(simTime,visualParams);
  if(now-lastStatus>1000){
    const fps=frameSamples.length?Math.round(frameSamples.length/frameSamples.reduce((a,b)=>a+b,0)):0;
    document.getElementById('motion-status').textContent=running?'Living pearl':'Still pearl';
    renderer.elt.dataset.time=simTime.toFixed(4);
    renderer.elt.dataset.fps=String(fps);
    frameSamples=[];lastStatus=now;
  }
}
function resizeStage(){
  if(!renderer) return;
  const [w,h]=stageSize();
  if(w!==width || h!==height) resizeCanvas(w,h);
}
function updateParam(name,value){
  if(!(name in defaultParams) || name==='seed') return;
  params[name]=Number(value);
  document.getElementById(name+'-value').textContent=Number(value).toFixed(2);
}
function updateTreatment(value){
  params.treatment=value==='psychedelic'?1:0;
  visualParams.treatment=params.treatment;
  document.getElementById('treatment').value=params.treatment?'psychedelic':'optical';
}
function updateSeedDisplay(){document.getElementById('seed-input').value=params.seed;}
function updateSeed(){
  const value=Number(document.getElementById('seed-input').value);
  if(Number.isSafeInteger(value)&&value>0&&value<=999999999){params.seed=value;initializeSystem();}
  else updateSeedDisplay();
}
function previousSeed(){params.seed=Math.max(1,params.seed-1);initializeSystem();}
function nextSeed(){params.seed++;initializeSystem();}
function randomSeedAndUpdate(){params.seed=Math.floor(Math.random()*999999)+1;initializeSystem();}
function resetParameters(){
  params={...defaultParams};
  document.getElementById('treatment').value='optical';
  for(const key of ['speed','spacing','wobble','iridescence']){
    document.getElementById(key).value=params[key];
    document.getElementById(key+'-value').textContent=params[key].toFixed(2);
  }
  initializeSystem();
}
function togglePause(){
  running=!running;previousTick=performance.now();
  const el=document.getElementById('pause-button');
  el.textContent=running?'Pause':'Play';el.setAttribute('aria-label',running?'Pause animation':'Play animation');
}
function toggleControls(){
  document.body.classList.toggle('immersive');
  const opened=!document.body.classList.contains('immersive');
  document.getElementById('controls-button').setAttribute('aria-expanded',String(opened));
  document.getElementById('controls-button').textContent=opened?'Hide controls':'Controls';
  requestAnimationFrame(resizeStage);
}
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else {document.body.classList.add('immersive');resizeStage();}
  }catch{document.getElementById('motion-status').textContent='Use the browser fullscreen control';}
}
function downloadFrame(){paintAt(simTime,visualParams);saveCanvas('opalia-seed-'+params.seed,'png');}
document.addEventListener('keydown',event=>{
  if(event.target.matches('input,textarea,select')||event.metaKey||event.ctrlKey||event.altKey)return;
  if(event.code==='Space'){event.preventDefault();togglePause();}
  if(event.key.toLowerCase()==='h')toggleControls();
  if(event.key.toLowerCase()==='r')randomSeedAndUpdate();
  if(event.key.toLowerCase()==='f')toggleFullscreen();
  if(event.key==='Escape'&&!document.body.classList.contains('immersive'))toggleControls();
});
document.addEventListener('visibilitychange',()=>{previousTick=performance.now();});

  results.farRingsStayDynamic=results.farEllipseRanges.every(range=>range[1]-range[0]>0.04&&range[1]>1.08);
  function faceColour(radius){
    const w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,s=Math.min(w,h)/2;
    const colour=[0,0,0];
    for(let j=0;j<48;j++){
      const angle=j*Math.PI/24,x=Math.round(w/2+s*radius*Math.cos(angle)),y=Math.round(h/2+s*radius*Math.sin(angle));
      for(let c=0;c<3;c++)colour[c]+=a[(y*w+x)*4+c]/(48*255);
    }
    return colour;
  }
  const faceColours=[0.19,0.27,0.34].map(faceColour);
  results.innerFaceColours=faceColours;
  results.centreColour=faceColour(0.015);
  results.centreIsCyan=results.centreColour[1]-results.centreColour[0]>0.20&&results.centreColour[2]-results.centreColour[0]>0.20;
  const luminance=c=>c[0]*0.2126+c[1]*0.7152+c[2]*0.0722;
  results.innerFaceLightToDark=luminance(faceColours[0])-luminance(faceColours[2])>0.025;
  results.innerFaceCyanOpening=faceColours[0][1]-faceColours[0][0]>0.15&&faceColours[0][2]-faceColours[0][0]>0.15;
  results.innerFaceBrightOpening=luminance(faceColours[0])>0.80;
  results.innerFaceCoolToWarm=faceColours[0][2]-faceColours[0][0]>0.15&&faceColours[2][0]-faceColours[2][2]>0.15;

  let pastel=0,vivid=0,peakChroma=0,luminous=0;
  for(let i=0;i<a.length;i+=4){
    const chroma=(Math.max(a[i],a[i+1],a[i+2])-Math.min(a[i],a[i+1],a[i+2]))/255;
    peakChroma=Math.max(peakChroma,chroma);if(chroma<0.3)pastel++;if(chroma>0.5)vivid++;
    if((a[i]*0.2126+a[i+1]*0.7152+a[i+2]*0.0722)/255>0.75)luminous++;
  }
  results.pastelFraction=pastel/(a.length/4);
  results.vividFraction=vivid/(a.length/4);
  results.peakChroma=peakChroma;
  results.luminousFraction=luminous/(a.length/4);
  results.luminousSurface=results.luminousFraction>0.65;
  results.pastelInteriorAndVividEdges=results.pastelFraction>0.40&&results.vividFraction>0.002&&results.vividFraction<0.20;
  let lo=255,hi=0;for(let i=0;i<a.length;i+=4){lo=Math.min(lo,a[i],a[i+1],a[i+2]);hi=Math.max(hi,a[i],a[i+1],a[i+2]);}
  results.pixelRange=[lo,hi];results.notBlank=hi-lo>70;
  results.glError=gl.getError();
  const stamps=[];
  await new Promise(resolve=>{
    function step(t){paintAt(t/1000);stamps.push(t);if(stamps.length<241)requestAnimationFrame(step);else resolve();}
    requestAnimationFrame(step);
  });
  const stableStamps=stamps.slice(30);
  const intervals=stableStamps.slice(1).map((v,i)=>v-stableStamps[i]);
  const sorted=[...intervals].sort((a,b)=>a-b);
  results.presentationFPS=1000/(intervals.reduce((a,b)=>a+b,0)/intervals.length);
  results.p95FrameMS=sorted[Math.floor(sorted.length*.95)];
  results.over50MS=intervals.filter(v=>v>50).length;
  results.canvas=[width,height,gl.drawingBufferWidth,gl.drawingBufferHeight];
  results.passed=results.deterministic&&results.animated&&results.independentLightFlow&&results.chromaticBandsOpenAndClose&&results.counterclockwiseFlow&&results.treatmentsAreDistinct&&results.psychedelicAnimated&&results.colourFlowsAgainstRipple&&results.luminousSurface&&results.smoothLightFlow&&results.noReplayCut&&results.seedChangesSurface&&results.colourControlWorks&&results.spacingControlWorks&&results.contourControlWorks&&results.nearTenSecondContinuity&&results.longRunContinuity&&results.notBlank&&results.rhythmicEllipses&&results.neighboursMoveDifferently&&results.outerRingsBreathe&&results.outerRingsMoveDifferently&&results.farRingsStayDynamic&&results.centreIsCyan&&results.innerFaceLightToDark&&results.innerFaceCyanOpening&&results.innerFaceBrightOpening&&results.innerFaceCoolToWarm&&results.pastelInteriorAndVividEdges&&results.glError===0;
  document.getElementById('qa-results').textContent=JSON.stringify(results,null,2);
  document.getElementById('qa-results').dataset.complete='true';
  document.title=results.passed?'PASS | Opalia':'FAIL | Opalia';
}

// An optional local QA route records the rendered surface for motion review.
function recordMotionPreview(){
  if(!renderer.elt.captureStream || typeof MediaRecorder==='undefined') return;
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(type=>MediaRecorder.isTypeSupported(type));
  if(!mime)return;
  const stream=renderer.elt.captureStream(60),chunks=[];
  const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000});
  recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data);};
  recorder.onstop=()=>{
    const url=URL.createObjectURL(new Blob(chunks,{type:mime}));
    const link=document.createElement('a');link.href=url;link.download='opalia-swirl.webm';link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    stream.getTracks().forEach(track=>track.stop());
  };
  recorder.start();setTimeout(()=>recorder.stop(),8000);
}
